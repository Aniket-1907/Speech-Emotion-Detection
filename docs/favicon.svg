<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Speech Emotion Detection</title>
  <desc id="desc">A profile speaking a colorful audio waveform beneath emotion symbols.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17243b"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28d9f5"/>
      <stop offset=".48" stop-color="#73f0c0"/>
      <stop offset="1" stop-color="#a56bff"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39e3f2"/>
      <stop offset=".55" stop-color="#3978ff"/>
      <stop offset="1" stop-color="#853cff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- Abstract speaking profile -->
  <path d="M25 13c-7 0-12 5-12 12 0 3 1 5 3 7l-1 5c0 2 2 3 4 4l1 5c1 3 4 5 8 5h3l-2-7 3-3-2-4 4-3-4-3c-1-1 0-3 1-4 2-2 2-6 0-9-1-3-4-5-6-5Z" fill="url(#face)"/>
  <path d="M19 22c2-4 7-6 11-4" fill="none" stroke="#9df7ff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 30c1.5 1 3 1 4.5 0" fill="none" stroke="#09152a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M29 37c1.5 1 3 1 4.5 0" fill="none" stroke="#09152a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sound waveform -->
  <g fill="url(#wave)">
    <rect x="32" y="32" width="3" height="8" rx="1.5"/>
    <rect x="37" y="27" width="3" height="18" rx="1.5"/>
    <rect x="42" y="23" width="3" height="26" rx="1.5"/>
    <rect x="47" y="29" width="3" height="14" rx="1.5"/>
    <rect x="52" y="33" width="3" height="6" rx="1.5"/>
    <circle cx="58" cy="36" r="1.5"/>
  </g>
  <!-- Emotion arc with compact expression dots -->
  <path d="M27 12c7-4 17-3 23 3" fill="none" stroke="#6475b6" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/>
  <g fill="none" stroke-width="1.4" stroke-linecap="round">
    <circle cx="31" cy="10" r="3.2" stroke="#65f09a"/>
    <path d="M29.5 10.2c.8 1 1.8 1 2.8 0" stroke="#65f09a"/>
    <circle cx="40" cy="8.5" r="3.2" stroke="#ffd34f"/>
    <path d="M38.7 9.5h2.6" stroke="#ffd34f"/>
    <circle cx="49" cy="12" r="3.2" stroke="#ff5d7e"/>
    <path d="M47.5 13.4c1-1 2-1 3 0" stroke="#ff5d7e"/>
  </g>
</svg>
